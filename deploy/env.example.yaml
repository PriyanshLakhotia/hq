# Copy to deploy/env.local.yaml (ignored), then replace every REPLACE_* value.
# Secrets are supplied through Secret Manager, never this file.
STORAGE_BACKEND: firestore
GOOGLE_CLOUD_PROJECT: REPLACE_PROJECT
FIRESTORE_DATABASE: '(default)'
FIRESTORE_PREFIX: hq
JOB_BACKEND: cloudtasks
CLOUD_TASKS_QUEUE: projects/REPLACE_PROJECT/locations/REPLACE_REGION/queues/hq-amp
TASKS_SERVICE_ACCOUNT: hq-tasks@REPLACE_PROJECT.iam.gserviceaccount.com
# Bootstrap with a valid placeholder origin if needed, then update to the actual URL.
PUBLIC_URL: https://example.invalid
OAUTH_REDIRECT_URIS: https://chatgpt.com/connector_platform_oauth_redirect
TIME_ZONE: UTC
AMP_ENABLED: 'false'
AMP_EXECUTOR: orb
AMP_PROJECT: ''
AMP_RUNNER_ID: ''
AMP_RUNNER_DIR: ''
AMP_JOB_TIMEOUT_MS: '600000'
AMP_MAX_JOBS_PER_DAY: '10'
AMP_DAILY_BUDGET_SECONDS: '1800'
