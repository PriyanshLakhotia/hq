services:
  hq:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      PORT: '8080'
      DATABASE_PATH: /app/data/hq.db
    expose:
      - '8080'
    volumes:
      - ${HQ_DATA_DIR:-./data}:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,exec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 128
    stop_grace_period: 15s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HQ_DOMAIN: ${HQ_DOMAIN:?Set HQ_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      hq:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
