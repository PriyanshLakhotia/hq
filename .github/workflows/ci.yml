name: Verify HQ
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify production container
        run: docker build -t hq-mcp:test .
      - name: Check non-root Amp runtime
        run: >-
          docker run --rm --read-only --tmpfs /tmp:size=256m,mode=1777,exec
          --cap-drop ALL --security-opt no-new-privileges:true
          --entrypoint node hq-mcp:test scripts/check-amp-runtime.mjs
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
